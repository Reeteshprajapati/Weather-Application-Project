# Server configuration
server.port=8080

# Application configuration
spring.application.name=weather-backend

# CORS Configuration for React Frontend
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174

# External Open-Meteo API Endpoints
openmeteo.geocoding.url=https://geocoding-api.open-meteo.com/v1/search
openmeteo.forecast.url=https://api.open-meteo.com/v1/forecast
openmeteo.client.timeout-seconds=10
